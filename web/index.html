<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Scene Generator</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <p class="brand">Scene Space</p>
        <h1>Turn a place into a navigable 3D scene</h1>
        <p class="lede">
          Upload a short video (best) or photos of a room / outdoor space.
          We reconstruct the <em>entire space</em> with VGGT and let you walk the
          camera around it.
        </p>

        <form id="upload-form">
          <label class="file">
            <input id="file" type="file" accept="image/*,video/*" required />
            <span id="file-label">Choose video or images</span>
          </label>

          <div class="row">
            <label>
              Max frames
              <input id="max-frames" type="number" min="1" max="48" value="16" />
            </label>
            <label>
              Sample fps
              <input id="target-fps" type="number" min="0.2" max="5" step="0.2" value="1" />
            </label>
          </div>

          <button type="submit" id="submit">Generate scene</button>
        </form>

        <div id="status" class="status" hidden></div>
        <pre id="meta" class="meta" hidden></pre>
      </aside>

      <main class="viewport">
        <div id="canvas-host"></div>
        <p id="hint" class="hint">Upload media to reconstruct a space</p>
      </main>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
